[package]
name = "ezthumb"
version = "4.0.0"
edition = "2021"
authors = ["Aaron Christopher Ramos <aaron.c.s.ramos@gmail.com>"]
description = "Video thumbnail contact-sheet generator with CLI and eframe/egui GUI powered by FFmpeg"
license = "GPL-3.0-only"
repository = "https://github.com/aaron-c-s-ramos/ezthumb"
readme = "README.md"
keywords = ["video", "thumbnail", "ffmpeg", "contact-sheet", "gui"]
categories = ["multimedia", "gui", "command-line-utilities"]
exclude = ["Screenshots/*", "packaging/*"]

[[bin]]
name = "ezthumb"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
